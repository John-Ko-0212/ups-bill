<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UPS 帳單彙整（Net Charge）</title>
  <style>
    :root{
      --bg:#0b1220; --muted:#9fb0d0; --text:#e8efff; --line:rgba(255,255,255,.12);
      --shadow: 0 18px 50px rgba(0,0,0,.45); --radius:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC","PingFang TC","Microsoft JhengHei", Arial;
      --warn:#ffcc66; --good:#73f3c5; --bad:#ff6b8a;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans); color:var(--text);
      background:
        radial-gradient(1200px 500px at 20% -10%, rgba(122,162,255,.30), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(115,243,197,.18), transparent 55%),
        radial-gradient(900px 650px at 30% 120%, rgba(255,107,138,.14), transparent 55%),
        var(--bg);
      min-height:100vh;
    }
    header{max-width:1100px;margin:28px auto 0;padding:0 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    h1{margin:0;font-size:20px}
    .pill{color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:8px 12px;border-radius:999px;box-shadow:0 10px 20px rgba(0,0,0,.2);font-size:13px;white-space:nowrap}
    main{max-width:1100px;margin:14px auto 30px;padding:0 18px;display:grid;grid-template-columns:1fr;gap:14px;}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
    .bd{padding:14px 16px}
    .banner{max-width:1100px;margin:14px auto 0;padding:0 18px;}
    .notice{
      border:1px solid rgba(255,204,102,.35);
      background:rgba(255,204,102,.07);
      border-radius:16px;
      padding:12px 14px;
      line-height:1.5;
      box-shadow:0 18px 50px rgba(0,0,0,.25);
    }
    .notice strong{color:var(--warn)}
    .status{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-family:var(--mono); font-size:12px; color:var(--muted);}
    .chip{border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:rgba(255,255,255,.05);}
    .chip.good{border-color:rgba(115,243,197,.35); color:var(--good)}
    .chip.bad{border-color:rgba(255,107,138,.35); color:var(--bad)}
    .drop{border:1px dashed rgba(255,255,255,.25);border-radius:16px;padding:18px;background:rgba(255,255,255,.03); text-align:center;}
    .drop strong{display:block;margin-bottom:6px}
    .drop span{color:var(--muted);font-size:13px}
    input[type=file]{margin-top:12px;width:100%}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px}
    .row > div{flex:1;min-width:220px}
    label{color:var(--muted);font-size:13px;display:block;margin-bottom:6px}
    input[type=text]{
      width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);color:var(--text);outline:none;
      font-family:var(--mono); font-size:12.5px;
    }
    button{
      border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text);
      padding:10px 12px;border-radius:14px;cursor:pointer;font-weight:650;
    }
    button.primary{
      background:linear-gradient(90deg, rgba(122,162,255,.85), rgba(115,243,197,.55));
      border-color:rgba(255,255,255,.18); color:#061021;
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    pre{
      background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.10);
      border-radius:14px;padding:12px;overflow:auto;color:#dfe8ff;font-family:var(--mono);font-size:12px;max-height:260px;
    }
    table{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,255,255,.02);min-width:980px}
    .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
    th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;font-size:13px}
    thead th{position:sticky;top:0;background:rgba(15,26,46,.92);backdrop-filter:blur(6px);color:#d8e4ff;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}
    .noscript{
      border:1px solid rgba(255,107,138,.35);
      background:rgba(255,107,138,.08);
      border-radius:16px;
      padding:10px 12px;
      margin-top:10px;
      font-family: var(--mono);
      font-size:12px;
    }
  </style>
</head>
<body>
<header>
  <h1>UPS 帳單彙整（Net Charge）</h1>
  <div class="pill">離線 / 企業網路友好版（外掛 JS 檔）</div>
</header>

<div class="banner">
  <div class="notice" id="notice">
    <div><strong>如果你之前「完全沒狀態」</strong>：多半是公司 CSP/資安擋掉「inline script」。</div>
    <div>這版把主程式改成外部 <code>app.js</code>，並建議把套件放在 <code>/vendor</code>（同源，最不容易被擋）。</div>

    <div class="status" id="statusRow">
      <div class="chip bad">JS 尚未啟動（如果一直看到這行＝app.js 沒載到或被擋）</div>
    </div>

    <noscript>
      <div class="noscript">你的瀏覽器目前關閉 JavaScript，請開啟後再使用。</div>
    </noscript>
  </div>
</div>

<main>
  <section class="card">
    <div class="hd">① 上傳帳單 PDF（可多選）</div>
    <div class="bd">
      <div id="drop" class="drop">
        <strong>把 UPS 帳單 PDF 拖進來</strong>
        <span>或使用下方選檔（多選）</span>
        <input id="file" type="file" accept="application/pdf" multiple />
      </div>

      <div class="row">
        <div>
          <label>免稅費用項目（不計入營業稅基礎；用 | 分隔）</label>
          <input id="exempt" type="text" value="VAT|Disbursement Fee|Entry Prep Fee|Paper Commercial Invoice" />
        </div>
        <div>
          <label>營業稅率（例：0.05）</label>
          <input id="taxRate" type="text" value="0.05" />
        </div>
        <div>
          <button id="run" class="primary" disabled>開始彙整</button>
          <button id="export" disabled>下載 Excel</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="hd">② 執行紀錄</div>
    <div class="bd"><pre id="log">尚未開始</pre></div>
  </section>

  <section class="card">
    <div class="hd">③ 預覽（Summary 前 200 列）</div>
    <div class="bd">
      <div class="tableWrap">
        <table id="tbl"><thead></thead><tbody></tbody></table>
      </div>
    </div>
  </section>
</main>

<!-- IMPORTANT: No inline JS here. -->
<script src="./app.js"></script>
</body>
</html>
